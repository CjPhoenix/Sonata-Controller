; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src
boards_dir = .

[env:esp32-s3-devkitc-1-myboard]
platform = espressif32
board = esp32-s3-devkitc-1-myboard
framework = arduino
platform_packages = framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32#2.0.3
build_flags = 
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-I./include
	-I../shared/include
	-DBOARD_HAS_PSRAM
	-DCONFIG_SPIRAM_MODE_OCTAL=1
	-DCONFIG_SPIRAM_SPEED_80M=1
lib_deps = 
	tamctec/TAMC_GT911@^1.0.2
	lvgl/lvgl@8.4.0
	h2zero/NimBLE-Arduino@^2.3.7
	maxpromer/PCA9557-arduino@^1.0.0
	lovyan03/LovyanGFX@^1.2.24
board_build.partitions = huge_app.csv
upload_speed = 460800
monitor_speed = 115200
